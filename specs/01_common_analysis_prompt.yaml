# work_history の各要素で使う項目名（職歴情報シートの列と対応）
work_history_sheet_columns:
  - 求職者NO
  - 何社目
  - 企業名
  - 事業内容
  - 在籍期間_年
  - 在籍期間_ヶ月
  - 職種フラグ
  - 職種メモ
  - 退職理由_大
  - 退職理由_中
  - 退職理由_小
  - 転職理由メモ

input_rules:
  - 卒業年月は「YYYY年3月 卒業」形式で出力する
  - 日付は「YYYY/MM/DD」、時刻は「HH:MM」
  - 応募求人数が不明な場合は0（数値）
  - インポート用照合キーは求職者NO（7桁）を数値として+1した値。求職者NOはWeb履歴書PDFのファイル名からのみ取得し、会話メモ・PDF本文内の番号は使用しない
  - 職種フラグはフラグリストの「職種リスト」から選択（複数可）。退職理由は「カテゴリ_大・中・小」から各1つ選択

procedure: |
  【重要】抽出→検証→要約の順で行う。3つの資料（面談メモ・PDF本文・フラグリスト）をそれぞれ個別に解析し、各ブロックの内容を漏れなく把握してから統合する。
  【Pass1 抽出】
  1. 面談の通話文字起こしメモを解析する。全文を最初から最後まで走査し、転職時期・退職理由・転職理由・希望・年収・学歴・スキル・応募状況・次回面談に加え、時制（未来型か過去型か：今後の予定か、過去の経歴の説明か）および「読むべき内容」「確認すべき資料・論点」をメモする。発話単位で重要情報が出ている箇所を漏らさず拾う。
  2. Web履歴書PDF本文を解析する。最初から最後まで読み通し、経歴・学歴・希望・スキル・氏名など、言及されている項目をすべてメモする。（なし）の場合はこのステップはスキップし、面談メモ・フラグリストのみを根拠とする。
  3. フラグリストを解析する。シート「リスト」の職種リスト・業種リスト・エリア・都道府県・市区・各フラグの選択肢・退職理由カテゴリ（カテゴリ_大・中・小）の表記を把握する。フラグ列の値はここに記載されている文言と完全に一致させる。
  4. 基本情報シートの列名一覧（本YAMLの basic_info_sheet_columns）のうち、手順1・2で得た情報で該当する列について、その列名をキーとして filemaker_mapping に追加する。キーは列名と完全一致させる（全角/半角・スペースも変えない）。フラグ列（〇〇フラグ）の値は、フラグリストに記載されている選択肢の文言をそのままコピーする。メモ列（〇〇メモ）には会話やPDFの該当部分の要約を1〜2文で書く（根拠となる発話を参照し、捏造しない）。初回面談まとめには、面談の要点を退職理由・背景・希望・課題などカテゴリ分けして整理する。記載が無い列だけキーを省略する。
  【Pass2 検証】
  5. 【確認用ステップ】面談メモとPDF本文を再度見直す。(a)「言及があるのに filemaker_mapping に含めていない列」が無いか。(b) 退職理由・転職理由が面談メモに言及されているのに、filemaker_mapping（転職時期メモ・転職活動期間メモ等）や work_history の退職理由・転職理由メモが空欄になっていないか。(c) 時制を判定し extracted_facts.tense を出力したか。漏れ・空欄があれば追加・修正する。
  6. extracted_facts に tense（未来/過去/混在/不明のいずれか）、reading_targets（読むべき内容・確認すべき論点の箇条書き配列）、必要に応じて evidence_map（退職理由・時制などの根拠抜粋）を設定する。
  【Pass3 要約・出力】
  7. 【職歴情報シート用】work_history を必ず出力する。PDF・面談メモから「〇〇社に在籍」「〇〇で〇年」など職歴の言及を在籍順にすべて拾い、配列で出力する。1件も無い場合のみ work_history: [] とする。各要素はオブジェクトとし、キーは 企業名, 事業内容, 在籍期間_年, 在籍期間_ヶ月, 職種フラグ, 職種メモ, 退職理由_大, 退職理由_中, 退職理由_小, 転職理由メモ のいずれかで記載する（日本語キー）。職種・退職理由はフラグリストの表記に合わせる。この work_history が職歴情報シートのデータ行になるため、漏れなく出力すること。
  8. missing_items には、3つの資料のいずれにも一切記載が無い項目のみ列挙する。
  9. 出力は valid JSON のみ。extracted_facts（candidate_no, candidate_name, work_history, tense を必ず含む。reading_targets, evidence_map は推奨）, filemaker_mapping, missing_items を必ず含む。work_history は配列であり、職歴が1件でもあればその件数分のオブジェクトを並べること。

final_instruction: |
  上記手順に従い、特に手順4・確認用ステップ（手順5）・手順6（tense/reading_targets）・手順7（work_history）で漏れが無いようにすること。
  面談メモ・PDFに一言でも触れている内容は、対応する列名をキーとして filemaker_mapping に必ず追加し、メモ列には要約を書くこと。ログにある情報を見落として空欄にしないこと。時制は必ず判定し tense に出力すること。
  職歴の言及（会社名・在籍期間・職種・退職理由など）は work_history に必ず在籍順で出力すること。work_history が空のままだと職歴情報シートが空白になる。
  不確実な場合は「不明」とだけせず、テキスト内の候補と根拠箇所を evidence_map に示して暫定結論を出すこと。
  出力は common_analysis_json として、extracted_facts / filemaker_mapping / missing_items を含むJSONのみを返してください。説明文・マークダウン・コードブロック記号は付けないでください。
