# =============================================================================
# T-029 generate_form prompt - 業種別質問テンプレ確定版
# 21 サブカテゴリ × 業界別質問テンプレ + 動的展開（決定論的、Gemini 不使用）
# =============================================================================
# 確定事項（Q1〜Q21）:
#   Q1  C: 先に 2-3 サブカテゴリで質感確認 → 残り量産
#   Q2  営業職 + 事務職 + 保育・福祉から生成
#   Q3  A: 各大項目から代表 1 つずつ = 計 3 サブカテゴリ
#   Q4  B: 徳さん + 山中さん型ハイブリッド
#   Q5  A: 業務内容セクションは会社ごとに動的展開
#   Q6  A: チェック各 11 項目固定 + Other
#   Q7  C: 会社ごと統合（配属先名 + 部署役職 + 会社規模）
#   Q8  C: 会社規模は数値入力 + わからない場合空白
#   Q9  B: 既知情報 help_text 提示 + 訂正型
#   Q10 B: 業務内容に自由記述 1 質問追加
#   Q11 B: 工夫にチェック + 自由記述 1 質問
#   Q12 B: 業務内容のみ会社別、工夫は全社共通
#   Q13 B: 業界別 KPI 3-5 質問可変
#   Q14 A: 共通必須セクション維持
#   Q15 A: 資格は個別質問（resumeData.qualifications で動的展開）
#   Q16 A: 住所は 1 質問 + help_text 提示
#   Q17 C: 同意確認チェック 1 項目
#   Q18 A: 冒頭挨拶現状維持
#   Q19 A: タイトル現状維持
#   Q20 B: 新セクション順序確定
#   Q21 A: 1 ファイルに統合出力
# =============================================================================

version: "v1.0"
target_subcategories:
  - sales_corporate
  - sales_personal
  - office_sales
  - office_general
  - office_accounting
  - office_hr
  - office_other
  - planning_marketing
  - planning_pr
  - planning_planning
  - planning_management
  - planning_other
  - it_dev
  - it_infra
  - it_internal
  - service_sales
  - service_cs
  - care_childcare
  - care_welfare
  - care_nurse
  - care_other

# -----------------------------------------------------------------------------
# 冒頭挨拶（Q18: 現状維持）
# -----------------------------------------------------------------------------
greeting:
  title: "{candidate_name}様_質問フォーム"  # Q19: 現状維持
  description: "候補者向けヒアリングフォーム（Candidate Intake から作成）"
  body: |
    お世話になっております。

    応募書類を作成するにあたり追加でいただきたい情報を以下の通りお送りいたします。
    質問内容につきましてわかる範囲で構いませんのでご記入頂けますと幸いです。

# -----------------------------------------------------------------------------
# 共通必須セクション（Q14: 維持）
# -----------------------------------------------------------------------------
common_sections:

  # ----- セクション 1: 高校確認 -----
  high_school:
    section_title: "高校についてお尋ねします"
    items:
      - title: "高校名と卒業年度、入学年度について教えてください"
        help_text: |
          ○○高等学校 20○○年4月入学
          ○○高等学校 20○○年3月卒業
        type: long_text
        required: true

  # ----- セクション 2: 資格（Q15: 個別質問、動的展開） -----
  qualifications:
    section_title: "お持ちの資格についてお聞きします"
    # resumeData.qualifications 配列ごとに以下を展開
    dynamic_per_qualification:
      title: "{qualification.name}の取得年月を教えてください"
      help_text: |
        （例：2023年03月）
        ※年月の形式で入力してください（YYYY年MM月）
        ※不明な場合は空白で構いません
      type: short_text
      required: true
    # 追加資格欄（資格 0 件でも 1 件以上でも常に表示）
    additional:
      title: "その他お持ちの資格"
      help_text: "他に追加で記載する資格がある場合は資格名：取得年月を追加記入してください。"
      type: long_text
      required: false

  # ----- セクション 3: 住所（Q16: 1 質問 + help_text 提示） -----
  address:
    section_title: "ご住所についてお尋ねします"
    items:
      - title: "ご住所について確認させてください。"
        help_text: |
          現在、当社で把握している住所はこちらです：
          {resumeData.personal_info.address_full}

          丁目・番地・マンション名・部屋番号など、不足している情報や訂正が
          ありましたらご記入ください。
          （例： 1-2-3 ○○マンション101号室）

          ※上記の住所で正しい場合は空白で構いません
        type: long_text
        required: false

# -----------------------------------------------------------------------------
# 業務内容セクション（Q5: 会社ごとに動的展開）
# -----------------------------------------------------------------------------
work_content_section:
  section_title: "業務内容について詳細をお聞きします"

  # resumeData.work_history 配列ごとに以下のブロックを展開
  dynamic_per_company:

    company_header:
      # 会社名を見出しとして表示（例： 「株式会社○○での業務内容について」）
      title_template: "{company.name}での業務内容について追加でご確認させてください。"

    # ----- Q7: 配属情報（共通フレーム、3 質問） -----
    placement_info:
      - title: "{company.name}の正式な配属先・部署名を教えてください"
        help_text: |
          現在把握している情報: {company.department or "未取得"}
          例：株式会社○○サポートセンター内、○○本部 法人営業課

          ※既に正しく把握している場合は空白で構いません
        type: short_text
        required: false

      - title: "{company.name}での役職を教えてください"
        help_text: |
          現在把握している情報: {company.position or "未取得"}
          例：係長、主任、リーダー、役職なし
        type: short_text
        required: false

      - title: "{company.name}の従業員数を教えてください"
        help_text: |
          数値のみで入力してください。例：50
          ※わからない場合は空白で構いません
        type: short_text
        required: false

    # ----- Q6: 担当業務チェック（11 項目 + Other、業界別） -----
    duties_check:
      title: "{company.name}で担当していた業務にチェックを入れてください（複数選択可）"
      help_text: "該当するものもしくは不明の場合は空白で構いません"
      type: multi_select
      choices_ref: "{subcategory.duties_choices}"  # サブカテゴリ別 11 項目
      include_other: true
      required: false

    # ----- Q13: 業界別 KPI（3-5 質問可変） -----
    kpi_questions_ref: "{subcategory.kpi_questions}"  # サブカテゴリ別 3-5 質問

    # ----- Q10: 自由記述 1 質問 -----
    notable_work:
      title: "{company.name}で特に注力していた業務について教えてください"
      help_text: |
        上記でチェックした業務のうち、特に力を入れていた業務とその内容、
        工夫や成果を具体的にお聞かせください。
      type: long_text
      required: false

# -----------------------------------------------------------------------------
# 工夫セクション（Q12: 全社共通 1 セクション）
# -----------------------------------------------------------------------------
mindset_section:
  section_title: "業務を行う上で工夫・意識していたこと"

  # ----- Q6: チェック 11 項目（業界別） -----
  mindset_check:
    title: "業務を行う上で、工夫していること・意識していることを選択してください（複数選択可）"
    help_text: "該当するものもしくは不明の場合は空白で構いません"
    type: multi_select
    choices_ref: "{subcategory.mindset_choices}"
    include_other: true
    required: false

  # ----- Q11: 自由記述 1 質問 -----
  mindset_episode:
    title: "特に意識していたことの具体的なエピソードを教えてください"
    help_text: "印象的だった経験・工夫・成果などを具体的にお聞かせください。"
    type: long_text
    required: false

# -----------------------------------------------------------------------------
# 共通汎用セクション（Q14: 維持、現状フォームから踏襲）
# -----------------------------------------------------------------------------
generic_sections:

  # ----- 仕事意識（汎用 7 項目） -----
  work_consciousness:
    section_title: "仕事において意識していたこと"
    items:
      - title: "■仕事において意識していたことを教えてください。"
        help_text: |
          お仕事をするうえで、特に意識していたことを2つ以上お選びください。

          該当するものもしくは不明の場合は空白で構いません
        type: multi_select
        choices:
          - |-
            1. コミュニケーション力
            報連相（報告・連絡・相談）、対内外調整力、丁寧な説明力、傾聴力、チームサポート
          - |-
            2. 責任感
            正確性、業務遂行力、自己管理能力、期限厳守、信頼関係構築
          - |-
            3. 計画力
            スケジュール管理、優先順位設定、タスク管理、長期的視野での業務遂行
          - |-
            4. 柔軟性
            変化対応力、多様な業務適応力、問題解決力、臨機応変な対応
          - |-
            5. 実績
            業務効率化、ミス削減、資料作成スピード向上、システム改善
          - |-
            6. 協調性
            チーム連携、部門間調整、円滑なコミュニケーション
          - |-
            7. その他
            PCスキル、文書作成能力、継続的な学習意欲
        required: false

  # ----- 自己 PR（汎用 10 項目） -----
  self_pr:
    section_title: "自己 PR"
    items:
      - title: "■自己PRでPRしたい内容を教えてください。"
        help_text: |
          単語形式で3つほどお選びください。

          該当するものもしくは不明の場合は空白で構いません
        type: multi_select
        choices:
          - |-
            1. コミュニケーション力
            傾聴力、説得力、チームワーク
          - |-
            2. 責任感
            誠実さ、目標達成力、自己管理能力
          - |-
            3. リーダーシップ
            チームビルディング、部下育成
          - |-
            4. 問題解決能力
            分析力、ロジカルシンキング
          - |-
            5. 計画力
            スケジュール管理、プロジェクト管理
          - |-
            6. 柔軟性
            変化対応力、学習意欲
          - |-
            7. 自己成長意欲
            向上心、継続的学習
          - |-
            8. 協調性
            チーム貢献、部門連携
          - |-
            9. 課題発見力
            業務改善、ボトルネック特定
          - |-
            10. 専門知識・スキル
            IT、語学、業界知識
        required: false

  # ----- 証明写真 -----
  photo_submission:
    section_title: "証明写真の提出について"
    items:
      - title: "■写真データの提出"
        help_text: |
          証明写真データをお持ちでない場合でも、ご自宅でスマホ撮影した画像で問題ございません。
          お手数ですが撮影のうえ、ご提出をお願いいたします。

          【撮影時の注意点】
          ・女性の方：スーツ着用、派手すぎないメイク・髪型
          ・男性の方：スーツ・ネクタイ・白ワイシャツ
          ・背景は当方で青色に加工します
          ・明るい場所で撮影してください
          ・セルフタイマーを使用し、置いた状態で撮影してください
        type: single_select
        choices:
          - "証明写真データを持っているため、別途提出。"
          - "証明写真データを持っていないが、証明写真機で別途撮影後提出。"
          - "自宅でスマホの撮影をして後日提出。"
        required: true

  # ----- Q17: 同意確認 -----
  consent:
    section_title: "ご記入内容の取り扱いについて"
    items:
      - title: "■ご記入内容の取り扱いについて"
        help_text: "下記にチェックを入れてご送信ください。"
        type: multi_select
        choices:
          - "上記内容を職務経歴書および応募書類の作成に使用することに同意します"
        required: true
        minimum_required: 1

# -----------------------------------------------------------------------------
# サブカテゴリ別テンプレ（3 サブカテゴリ先行）
# -----------------------------------------------------------------------------
subcategories:

  # =========================================================================
  # sales_corporate（法人営業）
  # =========================================================================
  sales_corporate:
    label: "法人営業"

    duties_choices:
      - "新規顧客開拓・テレアポ・飛び込み営業"
      - "既存顧客のフォロー・ルート営業"
      - "提案資料・見積書の作成"
      - "商談・プレゼンテーション"
      - "契約交渉・条件調整"
      - "受注処理・契約書取り交わし"
      - "顧客課題のヒアリング・ソリューション設計"
      - "アフターフォロー・カスタマーサクセス"
      - "営業数字の管理・進捗報告"
      - "後輩指導・営業同行"
      - "展示会・セミナーでの営業活動"

    mindset_choices:
      - "顧客の業界・事業課題を事前リサーチして商談に臨む"
      - "顧客の意思決定プロセスを把握しキーパーソンを特定する"
      - "数字（売上・件数・達成率）を意識した行動計画"
      - "商談後のフォロー・進捗管理を徹底する"
      - "競合他社との差別化ポイントを明確に伝える"
      - "顧客の長期的な信頼関係構築を重視する"
      - "チーム内で案件状況を共有し協力体制を作る"
      - "失注理由を分析し次の案件に活かす"
      - "業界トレンド・自社製品知識のアップデート"
      - "提案資料の質を継続的に改善する"
      - "報連相を徹底し上司・関係部署と連携する"

    # KPI: 5 質問
    kpi_questions:
      - title: "{company.name}での月間商談件数を教えてください"
        help_text: |
          数値のみで入力してください。例：30
          ※該当しない場合は空白で構いません
        type: short_text
        required: false

      - title: "{company.name}での月間受注件数を教えてください"
        help_text: |
          数値のみで入力してください。例：5
          ※該当しない場合は空白で構いません
        type: short_text
        required: false

      - title: "{company.name}での年間売上目標達成率を教えてください"
        help_text: |
          数値のみで入力してください（％は不要）。例：110
          ※該当しない場合は空白で構いません
        type: short_text
        required: false

      - title: "{company.name}で担当していた顧客数を教えてください"
        help_text: |
          数値のみで入力してください。例：50
          ※該当しない場合は空白で構いません
        type: short_text
        required: false

      - title: "{company.name}で扱っていた商材の平均単価・規模を教えてください"
        help_text: |
          例：100万円〜500万円、月額10万円のSaaS、年間契約1000万円規模 等
          ※該当しない場合は空白で構いません
        type: short_text
        required: false

  # =========================================================================
  # office_sales（営業事務）
  # =========================================================================
  office_sales:
    label: "営業事務"

    duties_choices:
      - "受発注処理・データ入力"
      - "見積書・請求書・契約書の作成"
      - "在庫管理・納期管理"
      - "顧客からの電話・メール対応"
      - "営業担当のサポート（資料作成・スケジュール調整）"
      - "売上・売掛金・買掛金の管理"
      - "取引先との納品・検収調整"
      - "各種帳票・伝票の管理・整理"
      - "システム入力・データ集計（Excel/基幹システム）"
      - "議事録・会議資料の作成"
      - "来客対応・備品管理"

    mindset_choices:
      - "正確性を最優先に処理ミスを防ぐ"
      - "業務効率化のためのフォーマット整備・テンプレ化"
      - "営業担当のスケジュール・進捗を先回りで把握する"
      - "顧客対応では迅速・丁寧を徹底する"
      - "データ集計・分析で営業判断を支援する"
      - "期日・納期管理を徹底する"
      - "システム・Excel 等のスキルを継続的に向上させる"
      - "チーム内で業務情報を共有し属人化を防ぐ"
      - "後輩・新人への業務マニュアル整備・引継ぎ"
      - "取引先との関係構築・継続的なコミュニケーション"
      - "コスト意識を持って業務遂行する"

    # KPI: 4 質問
    kpi_questions:
      - title: "{company.name}での月間処理件数を教えてください"
        help_text: |
          受発注・伝票処理・データ入力等の月間件数を数値で入力してください。例：200
          ※該当しない場合は空白で構いません
        type: short_text
        required: false

      - title: "{company.name}でサポートしていた営業担当の人数を教えてください"
        help_text: |
          数値のみで入力してください。例：5
          ※該当しない場合は空白で構いません
        type: short_text
        required: false

      - title: "{company.name}で行った業務効率化の実績があれば教えてください"
        help_text: |
          例：月20時間の削減、Excelマクロ化で処理時間50%短縮、フォーマット統一で確認工数半減 等
          ※該当しない場合は空白で構いません
        type: long_text
        required: false

      - title: "{company.name}で使用していた基幹システム・主なツール名を教えてください"
        help_text: |
          例：SAP、kintone、Salesforce、Excel、奉行シリーズ、freee 等
          ※該当しない場合は空白で構いません
        type: short_text
        required: false

  # =========================================================================
  # care_childcare（保育士）
  # =========================================================================
  care_childcare:
    label: "保育士"

    duties_choices:
      - "0〜2 歳児クラスの保育・生活支援"
      - "3〜5 歳児クラスの保育・教育活動"
      - "食事・排泄・睡眠等の生活援助"
      - "保育計画・指導計画の作成"
      - "保育記録・連絡帳の記入"
      - "行事の企画・準備・運営（運動会・発表会等）"
      - "保護者対応・保護者面談"
      - "保護者との連絡帳・送迎時のコミュニケーション"
      - "同僚保育士・園長との情報共有・連携"
      - "教材・遊具の準備・整理整頓"
      - "保健衛生管理（健康観察・感染症対策）"

    mindset_choices:
      - "子ども一人ひとりの個性・発達段階に合わせた接し方"
      - "安全・衛生管理を最優先する"
      - "保護者との信頼関係構築を重視する"
      - "保育記録を丁寧に残し成長を可視化する"
      - "同僚との情報共有・引継ぎを徹底する"
      - "緊急時（事故・体調不良）の冷静な対応"
      - "子どもの自主性・主体性を尊重した保育"
      - "行事・イベントを通じた成長機会の創出"
      - "保育計画と実践のフィードバックループを回す"
      - "保育士同士のチームワーク・連携"
      - "自己研鑽（保育の最新動向・研修参加）"

    # KPI: 3 質問
    kpi_questions:
      - title: "{company.name}で担当していた園児数を教えてください"
        help_text: |
          1 クラスあたりの園児数を数値で入力してください。例：20
          ※該当しない場合は空白で構いません
        type: short_text
        required: false

      - title: "{company.name}で担当していた年齢層を教えてください"
        help_text: |
          例：0〜2 歳児、3 歳児クラス、5 歳児クラス、混合クラス 等
          ※該当しない場合は空白で構いません
